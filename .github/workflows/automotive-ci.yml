# ==============================================================================
# AUTOMOTIVE VHAL CONTINUOUS INTEGRATION (CI) PIPELINE
# ==============================================================================
name: Automotive VHAL SIL Regression Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  automotive_regression:
    name: Run Full Verification Suite
    runs-on: [self-hosted, Windows, automotive-env]

    steps:
      - name: Step 1 - Fetch Latest Code Changes
        uses: actions/checkout@v4

      - name: Step 2 - Verify Host ADB Server Status
        shell: powershell
        run: |
          Write-Host "[CI] Auditing host Android Debug Bridge pipeline..."
          
          # Resolve absolute path for ADB within the system service boundaries
          $AdbPath = "$env:LOCALAPPDATA\Android\Sdk\platform-tools\adb.exe"
          if (Test-Path $AdbPath) {
              & $AdbPath devices
          } else {
              Write-Host "[WARNING] ADB not found in default user path, trying global fallback..."
              adb devices
          }

      - name: Step 3 - Purge and Rebuild Isolated Docker Container
        shell: powershell
        run: |
          Write-Host "[CI] Cleaning stale environments and orchestrating container layers..."
          docker compose down --remove-orphans
          
          $Content = Get-Content docker-compose.yml
          $NewContent = $Content | ForEach-Object {
              if ($_ -match "command:") { "    command: behave" } else { $_ }
          }
          Set-Content docker-compose.yml $NewContent

      - name: Step 4 - Execute Advanced BDD Gherkin Testing Automation
        shell: powershell
        run: |
          Write-Host "[CI] Launching Behave BDD regression engine..."
          docker compose up --build --exit-code-from can-simulator

      - name: Step 5 - Environment Teardown & Reset
        shell: powershell
        if: always()
        run: |
          Write-Host "[CI] Tearing down runtime instances and clearing dashboard overlays..."
          docker compose down
          
          $AdbPath = "$env:LOCALAPPDATA\Android\Sdk\platform-tools\adb.exe"
          if (Test-Path $AdbPath) {
              & $AdbPath shell input keyevent 3
          } else {
              adb shell input keyevent 3
          }
